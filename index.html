<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Printer Payment Test</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root { color-scheme: light; font-family: Georgia, serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #f2efe8; color: #20231f; }
        main { width: min(680px, calc(100% - 32px)); margin: 8vh auto; }
        .eyebrow { color: #b4512d; font: 700 12px Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 12px 0 8px; font-size: clamp(36px, 8vw, 64px); line-height: .95; font-weight: 500; }
        .intro { max-width: 500px; color: #5d625b; font: 16px/1.5 Arial, sans-serif; }
        form { margin-top: 32px; padding: 24px; background: #fffdf8; border: 1px solid #d9d3c7; box-shadow: 8px 8px 0 #d9c7b4; }
        label { display: block; margin: 16px 0 7px; font: 700 12px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
        label:first-child { margin-top: 0; }
        input { width: 100%; padding: 13px 14px; border: 1px solid #b9b6ad; background: #fff; color: inherit; font: 16px Arial, sans-serif; }
        button { width: 100%; margin-top: 22px; padding: 15px; border: 0; background: #b4512d; color: #fffdf8; cursor: pointer; font: 700 14px Arial, sans-serif; letter-spacing: .04em; }
        button:disabled { cursor: wait; opacity: .6; }
        #status { min-height: 24px; margin: 22px 0 0; font: 14px/1.5 Arial, sans-serif; }
        .success { color: #28734e; }
        .error { color: #a52d2d; }
        code { font-family: Consolas, monospace; font-size: 12px; }
    </style>
</head>
<body>
    <main>
        <div class="eyebrow">Printer / payment sandbox</div>
        <h1>Pay for a print job.</h1>
        <p class="intro">Create a Razorpay test order, complete Checkout, and send the verified payment to the printer API.</p>

        <form id="payment-form">
            <label for="user-id">User ID</label>
            <input id="user-id" name="user_id" value="test-user" required>

            <label for="file-path">Server-side PDF path</label>
            <input id="file-path" name="file_path" placeholder="C:\\prints\\document.pdf" required>

            <label for="range">Pages</label>
            <input id="range" name="range" placeholder="1-3 or 1,3">

            <label for="color">Color</label>
            <select id="color" name="color" required>
                <option value="black">Black & White</option>
                <option value="color">Color</option>
            </select>
            <label for="copies">Copies</label>
            <input id="copies" name="copies" type="number" min="1" step="1" value="1" required>

            <button id="pay-button" type="submit">Create order and pay</button>
            <p id="status" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const form = document.querySelector('#payment-form');
        const button = document.querySelector('#pay-button');
        const status = document.querySelector('#status');

        function showStatus(message, type = '') {
            status.textContent = message;
            status.className = type;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            button.disabled = true;
            showStatus('Creating Razorpay order...');

            const formData = new FormData(form);
            const details = {
                user_id: formData.get('user_id'),
                file_path: formData.get('file_path'),
                range: formData.get('range'),
                pages: formData.get('pages'),
                color: formData.get('color'),
                copies: Number(formData.get('copies'))
            };

            try {
                const orderResponse = await fetch('/api/orders/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        currency: 'INR',
                        receipt: `print_${Date.now()}`,
                        filePath: details.file_path
                    })
                });
                const order = await orderResponse.json();
                if (!orderResponse.ok) throw new Error(order.error || 'Could not create order');

                const configResponse = await fetch('/api/config/razorpay');
                const config = await configResponse.json();
                if (!config.keyId) throw new Error('RAZORPAY_KEY_ID is not configured on the server');

                const checkout = new Razorpay({
                    key: config.keyId,
                    amount: order.amount,
                    currency: order.currency,
                    name: 'Printer',
                    description: 'Print job',
                    order_id: order.id,
                    handler: async (payment) => {
                        showStatus('Verifying payment...');
                        const verifyResponse = await fetch('/api/orders/verify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...payment, ...details })
                        });
                        const result = await verifyResponse.json();
                        if (!verifyResponse.ok) throw new Error(result.error || 'Payment verification failed');
                        showStatus(result.message, 'success');
                        button.disabled = false;
                    },
                    modal: { ondismiss: () => { button.disabled = false; showStatus('Payment cancelled.'); } }
                });
                checkout.open();
            } catch (error) {
                showStatus(error.message, 'error');
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
